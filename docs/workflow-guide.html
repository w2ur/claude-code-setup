const COMMANDS = [
  { name: "/sync", args: "(aucun argument)", args_en: "(no arguments)", desc: "Valide le frontmatter de la collection stories du hub (modalities, featured_rank, live_url, keywords, seo_description) et rapporte les violations. Depuis la décision M12, ne scanne plus de manifest et ne régénère plus rien.", desc_en: "Validates the frontmatter of the hub's stories collection (modalities, featured_rank, live_url, keywords, seo_description) and reports violations. Since decision M12 it no longer scans a manifest and no longer regenerates anything.", agents: ["portfolio-sync"], agents_en: ["portfolio-sync"], when: "Après un ajout/edit de story, ou en session hygiène", when_en: "After adding or editing a story, or during a hygiene session" },
  { name: "/new-app", args: "$0 (nom-en-kebab-case)", args_en: "$0 (name-in-kebab-case)", desc: "Scaffold complet conforme à la charte : repo Git, README (avec frontmatter Layer 2 : name/tagline_fr/tagline_en), CLAUDE.md, .gitignore, premier commit, repo GitHub privé, et une entrée editorial.ts si l'app doit avoir une tile sur le hub.", desc_en: "Full scaffold that follows the conventions: Git repo, README (with Layer 2 frontmatter: name/tagline_fr/tagline_en), CLAUDE.md, .gitignore, first commit, private GitHub repo, and an editorial.ts entry if the app should get a hub tile.", agents: ["implementer"], agents_en: ["implementer"], when: "Création d'une nouvelle app dans le portfolio", when_en: "Creating a new app in the portfolio" },
  { name: "/audit", args: "[URL canonique optionnelle]", args_en: "[optional canonical URL]", desc: "Lance docs-checker (sonnet) et portfolio-audit (haiku) en parallèle sur le projet courant. Produit un rapport consolidé.", desc_en: "Runs docs-checker (sonnet) and portfolio-audit (haiku) in parallel on the current project. Produces one consolidated report.", agents: ["docs-checker", "portfolio-audit"], agents_en: ["docs-checker", "portfolio-audit"], when: "Avant un release, une publication, ou pendant un compliance sweep", when_en: "Before a release, before publishing, or during a compliance sweep" },
  { name: "/cleanup", args: "[disk-only | plans-only | plugins-only | memory-only]", args_en: "[disk-only | plans-only | plugins-only | memory-only]", desc: "Step 0 — hygiène disque de ~/.claude via scripts/disk-hygiene.sh : deux tiers, AUTO appliqué sans demander (état éphémère aux rétentions annoncées + archivage des plans, jamais de suppression de plan), CONFIRM derrière --yes-projects / --yes-plugins (dossiers projects/ obsolètes, dossiers plugins temporaires). Puis : plans orphelins dans les repos, audit des plugins, compactage de la mémoire agent > 200 lignes, et check de staleness du workflow guide / docs stratégiques / claude-code-setup. Les rétentions vivent dans le script, jamais dans la commande.", desc_en: "Step 0 — disk hygiene for ~/.claude via scripts/disk-hygiene.sh: two tiers, AUTO applied without asking (ephemeral state down to the stated retentions + plan archiving, never a plan deletion), CONFIRM behind --yes-projects / --yes-plugins (stale projects/ directories, plugin temp directories). Then: orphan plans inside repos, plugin audit, agent-memory compaction past 200 lines, and a staleness check on the workflow guide / strategic docs / claude-code-setup. The retention numbers live in the script, never in the command.", agents: [], agents_en: [], when: "1×/semaine en hygiène. Le tier AUTO tourne aussi sans modèle en cron le 15 du mois à 8h07 (scripts/cleanup-cron.sh → cleanup-cron.log), décalé du /tech-debt du 1er", when_en: "Once a week, as hygiene. The AUTO tier also runs model-free from cron on the 15th at 8:07am (scripts/cleanup-cron.sh → cleanup-cron.log), offset from the /tech-debt run on the 1st" },
  { name: "/tech-debt", args: "[app1 app2 ... | --triage-only]", args_en: "[app1 app2 ... | --triage-only]", desc: "Revue technique mensuelle en 2 phases. Phase 1 : triage rapide via scripts/tech-debt-triage.sh — entièrement déterministe donc sans modèle (activité commits, proéminence portfolio via editorial.ts, ancienneté du dernier deep review, vulnérabilités / deps obsolètes / console.log). Le script est la source de vérité des 4 signaux et de leurs poids : la commande les décrit, ne les réimplémente jamais. Lecture seule — il n'écrit pas le rotation tracker, c'est la Phase 4 qui le fait. Phase 2 : revue approfondie sur les apps sélectionnées, seule partie qui demande du jugement. Auto-fix ce qui est safe, flag le reste.", desc_en: "Monthly technical review in 2 phases. Phase 1: fast triage via scripts/tech-debt-triage.sh — fully deterministic, therefore model-free (commit activity, portfolio prominence via editorial.ts, age of the last deep review, vulnerabilities / outdated deps / console.log). The script is the source of truth for the 4 signals and their weights: the command describes them, it never re-implements them. Read-only — it does not write the rotation tracker, Phase 4 does. Phase 2: deep review on the selected apps, the only part that takes judgement. Auto-fixes what is safe, flags the rest.", agents: ["implementer (auto-fix)", "troubleshooter (si migration majeure)"], agents_en: ["implementer (auto-fix)", "troubleshooter (for a major migration)"], when: "1×/mois en session dédiée. La Phase 1 tourne aussi sans modèle en cron le 1er du mois à 8h07 (scripts/tech-debt-triage.sh → tech-debt-cron.log), décalée du /cleanup du 15", when_en: "Once a month, in a dedicated session. Phase 1 also runs model-free from cron on the 1st at 8:07am (scripts/tech-debt-triage.sh → tech-debt-cron.log), offset from the /cleanup run on the 15th" },
  { name: "/sync-setup", args: "[--dry-run | --audit-only]", args_en: "[--dry-run | --audit-only]", desc: "Synchronise le repo claude-code-setup depuis ~/.claude/. Copie + anonymise les fichiers, nettoie les fichiers obsolètes, met à jour le README (compteurs, noms), vérifie l'absence de données personnelles.", desc_en: "Syncs the claude-code-setup repo from ~/.claude/. Copies and anonymizes the files, removes the stale ones, updates the README (counts, names), and checks that no personal data leaked.", agents: [], agents_en: [], when: "Après des changements de workflow (nouvel agent, commande renommée, nouveau hook)", when_en: "After a workflow change (new agent, renamed command, new hook)" },
  { name: "/next", args: "A | B | un task id (ex. A1.2, B0)", args_en: "A | B | a task id (e.g. A1.2, B0)", desc: "Exécute la prochaine tâche non bloquée d'un track du master plan, puis s'arrête. Lit le ledger du track, vérifie les gates et les règles cross-track, dispatche le travail aux sub-agents plutôt que de le faire en contexte, vérifie contre la réalité (pas contre le diff), met à jour le ledger. Une session = une phase.", desc_en: "Runs the next unblocked task of a master-plan track, then stops. Reads the track ledger, checks the gates and the cross-track rules, dispatches the work to sub-agents instead of doing it in context, verifies against reality (not against the diff), updates the ledger. One session = one phase.", agents: [], agents_en: [], when: "Exécution d'un plan multi-phase approuvé — A = portfolio (~/Dev), B = setup (~/.claude)", when_en: "Executing an approved multi-phase plan — A = portfolio (~/Dev), B = setup (~/.claude)" },

  { name: "portfolio-sync", model: "sonnet", skills: ["portfolio-conventions"], memory: true, desc: "Valide le frontmatter de la collection stories du hub (modalities, featured_rank, live_url...). Read-only. Depuis la décision M12 (retrait de .portfolio.yml), c'est tout ce qui reste de cet agent — candidat à devenir un script déterministe.", desc_en: "Validates the frontmatter of the hub's stories collection (modalities, featured_rank, live_url...). Read-only. Since decision M12 (dropping .portfolio.yml) that is all this agent still does — a candidate for becoming a deterministic script." },
  { name: "docs-checker", model: "sonnet", skills: [], memory: false, desc: "Audite et corrige README, CLAUDE.md, .gitignore, URLs. Fixe les problèmes mécaniques directement. Vérifie que les URLs live/demo déclarées répondent vraiment (2xx/3xx) et signale les deux sens : déclaré-mais-absent et présent-mais-non-déclaré.", desc_en: "Audits and fixes README, CLAUDE.md, .gitignore, URLs. Fixes the mechanical problems directly. Checks that the declared live/demo URLs actually answer (2xx/3xx) and reports both directions: declared-but-missing and present-but-undeclared." },

  { name: "stale-readme-guard", event: "PreToolUse → Bash(git push)", desc: "Avant push : vérifie qu'aucun commit non-pushé ne change les deps / config deploy sans toucher au README.md. Depuis la décision M12 s'applique à tout repo (l'ancien filtre .portfolio.yml aurait rendu ce hook silencieusement inopérant partout).", desc_en: "Before a push: checks that no unpushed commit changes the deps / deploy config without touching README.md. Since decision M12 it applies to every repo (the old .portfolio.yml filter would have made this hook silently inert everywhere).", mode: "Advisory" },
  { name: "push-build-gate", event: "PreToolUse → Bash(git push)", desc: "Avant push : lance npm run build PUIS npm test dans le repo ciblé. Bloque (exit 2) si le build échoue, si des warnings apparaissent, ou si la suite de tests est rouge — le stage tests a été ajouté le 2026-08-05 après qu'un commit à suite rouge soit arrivé sur origin/main avec un build vert. Une suite qui ne se termine pas est non bloquante (exit 1, budget PUSH_GATE_TEST_TIMEOUT, 90 s par défaut) : on échoue ouvert sur une panne du garde, fermé sur son verdict. Contourner le stage tests avec TEST_GATE_SKIP=1 git push. Il remplace l'ancien hook Stop build-check. Depuis 2026-08-03 il embarque aussi le payload gate : il bloque quand une route passe de prérendue (○/●/◐) à dynamique (ƒ) et avertit (exit 1, non bloquant) si le payload prérendu ou le total RSC dépasse 3× sa baseline. Contourner avec PAYLOAD_GATE_ACCEPT=1 git push. Baselines dans ~/.claude/payload-baselines/. Sa propre logique d'aiguillage est couverte par hooks/push-build-gate/test_hook.sh.", desc_en: "Before a push: runs npm run build and THEN npm test in the target repo. Blocks (exit 2) on a failed build, on warnings, or on a red test suite — the test stage was added on 2026-08-05 after a commit with a red suite reached origin/main behind a green build. A suite that never finishes is non-blocking (exit 1, PUSH_GATE_TEST_TIMEOUT budget, 90 s by default): fail open on the guard's own malfunction, closed on its verdict. Skip the test stage with TEST_GATE_SKIP=1 git push. Since 2026-08-03 it also carries the payload gate: it blocks when a route flips from prerendered to dynamic and warns (exit 1, non-blocking) when the prerendered payload or the RSC total exceeds 3x its baseline. Bypass with PAYLOAD_GATE_ACCEPT=1 git push. Baselines in ~/.claude/payload-baselines/. Its own dispatch logic is covered by hooks/push-build-gate/test_hook.sh.", mode: "Blocking" },
];

      </div>)}

      {/* === HOOKS TAB === */}
      {tab==="hooks"&&(<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {HOOKS.map((h,i)=>(<div key={i} style={{padding:"14px 18px",borderRadius:8,background:"#0F172A",border:"1px solid #1E293B"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
            <code style={{fontSize:14,fontWeight:800,color:"#F8FAFC"}}>{h.name}</code>
            {pill("#F59E0B22","#F59E0B",h.event)}
            {pill("#10B98122","#10B981",h.mode)}
          </div>
          <p style={{fontSize:11,color:"#94A3B8",lineHeight:1.5}}>{t(h,"desc")}</p>
        </div>))}
        <div style={{padding:"12px 16px",borderRadius:8,background:"#1E293B",marginTop:8}}>
          <p style={{fontSize:11,color:"#64748B",lineHeight:1.6}}>{U.hooksNoteA}<strong style={{color:"#10B981"}}>{U.hooksNoteAdvisory}</strong>{U.hooksNoteB}<strong>{U.hooksNoteBlocking}</strong>{U.hooksNoteC}<code>{U.hooksNoteCode}</code>{U.hooksNoteD}</p>
        </div>
      </div>)}

      {/* === SCENARIOS TAB === */}
      {tab==="scenarios"&&(<>
        <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
          {[{id:"all",label:U.filterAll,color:"#94A3B8"},...Object.entries(CATEGORIES).map(([id,c])=>({id,label:t(c,"label"),color:c.color}))].map(f=>(
            <button key={f.id} onClick={()=>{setFlt(f.id);setAid(null)}} style={{padding:"6px 14px",fontSize:11,fontWeight:600,fontFamily:F,borderRadius:6,background:flt===f.id?f.color+"22":"#1E293B",color:flt===f.id?f.color:"#64748B",border:"1px solid "+(flt===f.id?f.color+"44":"#334155"),transition:"all 0.15s"}}>{f.label}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:16,minHeight:"65vh"}}>
          <div style={{width:260,flexShrink:0,display:"flex",flexDirection:"column",gap:6}}>
            {fl.map(s=>{const ct=CATEGORIES[s.category];const on=aid===s.id;return(
              <button key={s.id} onClick={()=>setAid(on?null:s.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:8,border:"1px solid "+(on?ct.color+"66":"#1E293B"),background:on?ct.bg:"#0F172A",textAlign:"left",fontFamily:F,transition:"all 0.15s"}}>
                <span style={{fontSize:18,lineHeight:1,opacity:on?1:0.5}}>{s.icon}</span>
                <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:on?"#F8FAFC":"#94A3B8"}}>{t(s,"title")}</div><div style={{fontSize:10,color:"#64748B",marginTop:2}}>{t(s,"frequency")}</div></div>
                <span style={{fontSize:9,padding:"2px 6px",borderRadius:3,background:ct.color+"22",color:ct.color,fontWeight:600}}>{t(ct,"label").slice(0,3).toUpperCase()}</span>
              </button>)
            })}
          </div>
          <div style={{flex:1,minWidth:0}}>
            {!ac?(<div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:10,border:"1px dashed #1E293B",color:"#334155",fontSize:13}}>{U.emptyState}</div>):(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{padding:"14px 18px",borderRadius:10,background:CATEGORIES[ac.category].bg,border:"1px solid "+CATEGORIES[ac.category].color+"33"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}><span style={{fontSize:22}}>{ac.icon}</span><h2 style={{fontSize:17,fontWeight:700,color:"#F8FAFC",margin:0}}>{t(ac,"title")}</h2></div>
                <p style={{fontSize:12,color:"#94A3B8",margin:0}}>{t(ac,"when")}</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:2}}>
                {/* Colour is keyed off the canonical (fr) tool label so both languages render identically. */}
                {ac.steps.map((st,i)=>{const tc=gtc(st.tool);return(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"26px 1fr",gap:10}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                      <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"#1E293B",border:"2px solid "+tc,fontSize:10,fontWeight:800,color:tc}}>{i+1}</div>
                      {i<ac.steps.length-1&&<div style={{width:2,flex:1,background:"#1E293B",minHeight:6}}/>}
                    </div>
                    <div style={{padding:"8px 12px",marginBottom:3,borderRadius:7,background:"#0F172A",border:"1px solid #1E293B"}}>
                      <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:3}}>
                        <span style={{fontSize:12,fontWeight:700,color:"#F8FAFC"}}>{t(st,"action")}</span>
                        <code style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:tc+"18",color:tc,fontWeight:600}}>{t(st,"tool")}</code>
                      </div>
                      <p style={{fontSize:11,color:"#64748B",margin:0,lineHeight:1.4}}>{t(st,"detail")}</p>
                      <div style={{fontSize:10,color:"#475569",marginTop:3}}>{t(st,"where")}</div>
                    </div>
                  </div>)})}
              </div>
              <div style={{padding:"12px 16px",borderRadius:8,background:"#EF444410",border:"1px solid #EF444433"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#EF4444",marginBottom:6}}>{U.trapsTitle}</div>
                {t(ac,"traps").map((tr,i)=>(<div key={i} style={{fontSize:11,color:"#FCA5A5",lineHeight:1.5,paddingLeft:12,position:"relative",marginBottom:2}}><span style={{position:"absolute",left:0}}>•</span>{tr}</div>))}
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",padding:"8px 12px",borderRadius:6,background:"#0F172A",border:"1px solid #1E293B"}}>
                {[{l:"/command",c:"#3B82F6"},{l:"plugin",c:"#A855F7"},{l:"hook",c:"#F59E0B"},{l:"terminal",c:"#F97316"},{l:U.legendProject,c:"#64748B"},{l:"auto",c:"#10B981"}].map(x=>(
                  <div key={x.l} style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:7,height:7,borderRadius:"50%",background:x.c}}/><span style={{fontSize:9,color:"#64748B"}}>{x.l}</span></div>
                ))}
              </div>
            </div>)}
          </div>
        </div>
      </>)}
    </div></div>)
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
