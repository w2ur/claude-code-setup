# Anonymization mapping — EXAMPLE
# Copy this to anonymization.yaml and replace with your real data.
# anonymization.yaml is gitignored and never committed.
#
# Option B strategy: public apps keep real names, private apps get placeholders.
# This way your public repos are recognizable, but private projects stay hidden.

replacements:
  # GitHub username
  "your-gh-user": "{github-username}"

  # Portfolio site
  "your-portfolio-site": "{portfolio-site}"
  "your-site.dev": "{portfolio-site-url}"

  # App URLs (anonymize even for public apps — URLs reveal the owner)
  "myapp.dev": "myapp.example.com"
  "budget.yoursite.dev": "budget.example.com"
  # CAREFUL: for a PRIVATE app's domain, the target must be that app's
  # placeholder slug, not its real one. Mapping "board-game-thing.dev" to
  # "board-game-thing.example.com" would launder the domain while leaving
  # the private name readable — resolve it to the same placeholder used
  # under "Private app slugs" below instead (e.g. "my-boardgame-app.example.com").
  # CAREFUL, second form: a domain also appears REVERSED, in launchd
  # LaunchAgent labels ("dev.yoursite.my-job.plist"). The rule above cannot
  # catch it — the components are in the opposite order — so add the reversed
  # prefix as its own entry. Keep it general rather than per-label so the next
  # LaunchAgent needs no edit here.
  "dev.yoursite.": "com.example."

  # People
  "Jane Doe": "{author-name}"
  "Jane": "{author-first-name}"

  # Private app slugs (use descriptive placeholders)
  "my-secret-project": "my-sample-app"
  "private-tool": "my-tool"
  "board-game-thing": "my-boardgame-app"
  # CAREFUL: never put a slug here when a PUBLIC name starts with it.
  # `replacements` is an exact-substring net, so a "trader" entry would also
  # rewrite a public "trader-core" package into "my-trading-app-core".
  # Use a lookahead-guarded rule under `patterns` instead — see below.

  # Public app slugs — leave them out! They stay as-is.
  # Listed here for documentation:
  #   my-public-app, another-public-app
  # Verify each one with `gh repo view <owner>/<name>` before trusting this
  # list: a repo flipped to private is exactly the leak this file must catch.

  # Emails
  "me@mysite.dev": "{email}"

patterns:
  '/Users/[^/\s]+/': '/Users/{username}/'
  '/home/[^/\s]+/': '/home/{username}/'
  # Dash-flattened home paths (e.g. project dirs like -Users-<name>-Dev)
  '-Users-[^-/\s]+-': '-Users-{username}-'
  '-home-[^-/\s]+-': '-home-{username}-'
  # Private slug that prefixes a public one: the lookahead keeps `trader-core`
  # intact while still anonymizing the bare private `trader`.
  '\btrader\b(?!-)': 'my-trading-app'

audit_patterns:
  - 'your-gh-user'
  - 'yoursite\.dev'
  - 'Jane'
  - 'my-secret-project'
  - 'private-tool'
  - 'board-game-thing'
  # Mirror the lookahead so the public `trader-core` never trips the audit.
  - '\btrader\b(?!-)'

skip:
  # The repo's hooks/README.md is owner-maintained and exempt from orphan
  # pruning, but the 'hooks/*.md' mapping below would still make it a sync
  # DESTINATION — a live ~/.claude/hooks/README.md would overwrite it.
  - 'hooks/README.md'
  # A hook's Python test usually reads fixtures (build output, sample payloads)
  # that no file_map pattern carries, so publishing the test alone ships a
  # suite that cannot run — and the fixtures themselves are the most likely
  # thing in a hook directory to hold private data.
  - 'hooks/**/test_*.py'
  - 'agent-memory/**'
  - 'plans/**'
  - 'projects/**'
  - 'plugins/**'
  - 'settings.json'
  - 'settings.local.json'

file_map:
  'CLAUDE.md': 'CLAUDE.md'
  'commands/*.md': 'commands/'
  'agents/*.md': 'agents/'
  'skills/**/*.md': 'skills/'
  'skills/**/*.sh': 'skills/'
  'hooks/**/*.sh': 'hooks/'
  # Hooks and scripts can both ship a .py next to their .sh. Both patterns are
  # needed: a hook or script written in Python is otherwise skipped silently,
  # which is how push-build-gate was published without payload_gate.py.
  'hooks/**/*.py': 'hooks/'
  'hooks/*.md': 'hooks/'
  'scripts/*.sh': 'claude-scripts/'
  'scripts/*.py': 'claude-scripts/'

# Extra files outside ~/.claude/ that should also be synced + anonymized.
# NOTE: docs/workflow-guide.html is generated from live config by
# scripts/generate_workflow_guide.py (invoked by sync.py), which anonymizes
# its own output — do not list it here or it would be double-written.
extra_files: {}
